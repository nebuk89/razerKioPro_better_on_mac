[package]
name = "kiyo-control"
version = "0.1.0"
edition = "2024"
description = "Persistent macOS controls for the Razer Kiyo Pro"
license = "MIT"

[[bin]]
name = "kiyo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rusb = { version = "0.9", features = ["vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
